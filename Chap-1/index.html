<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 1 - Alerts</title>
    <!-- 7(a) Script inside Head -->
    <script>
        alert("Script inside Head");
    </script>
      
      <!-- CSS can be placed in an external file and linked to the HTML document using the <link> tag with the rel attribute set to "stylesheet" and the href attribute set to the path of the CSS file. This is a good practice for keeping your code organized and separating content from presentation. -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 6. Make use of alerts in your existing HTML & CSS project -->
     <h1>My Website</h1>

    <button onclick="hello()">Click Me</button>


    <!-- 7(b) Script inside Body before HTML -->

    <script>
        alert("Script is before body HTML");
    </script>


    <h1>
        My First JavaScript Program
    </h1>

    <!-- 7(c) Script inside body HTML -->

    <script>
        alert("Script is inside body HTML");
    </script>


    <p>Welcome to my website! </p>

    <!-- 7(d) Script after body HTML -->
      <script>
        alert("Script is after body HTML");
    </script>


    <!-- Javascript code can be placed in an external file and linked to the HTML document using the <script> tag with the src attribute. This is a good practice for keeping your code organized and separating content from behavior. -->

    <script src="app.js"></script>
</body>

</html>

  <!-- QUESTION 3 -->
  <!-- Create a student form and display student details in a table.
    Each row must have Edit and Delete buttons.
    Edit button should display a hidden form with that row's values. -->

  <div class="section">

    <h2>3. Student Details</h2>

    <form id="studentForm" onsubmit="addStudent(event)">

      <input type="text" id="studentName" placeholder="Student Name" required>

      <input type="text" id="studentClass" placeholder="Class" required>

      <input type="text" id="studentRoll" placeholder="Roll Number" required>

      <input type="email" id="studentEmail" placeholder="Email" required>

      <br>

      <button type="submit">Add Student</button>

    </form>


    <!-- Student Table -->

    <table border="1px">

      <thead>
        <tr>
          <th>Name</th>
          <th>Class</th>
          <th>Roll Number</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="studentTable">

      </tbody>

    </table>
    <div id="editFormContainer">
      <h2>Edit Student Details</h2>
      <form id="editStudentForm" onsubmit="saveChanges(event)">
        <label>Name:</label>
        <input type="text" id="editName" required>
        <label>Class:</label>
        <input type="number" id="editClass" required>
        <label>Roll Number:</label>
        <input type="number" id="editRoll" required>
        <label>Email:</label>
        <input type="email" id="editEmail" required>
        <button type="submit">Save Changes</button>
        <button type="button" onclick="closeEditForm()">Cancel</button>
      </form>
    </div>


    <script src="app.js"></script>
</body>
